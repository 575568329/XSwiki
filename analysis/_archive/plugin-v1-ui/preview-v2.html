<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>小说Wiki v2 · 布局样式预览</title>
<style>
/* ============ 主题：玄鉴仙族 · 古镜月华 ============
   由图书描述推导：铜镜(镜青) + 月华太阴(月白) + 明阳鎏金(金)
   换书时改这一段 CSS 变量 + BOOK_SIGIL 即可 */
:root {
  --bg:#f4f1e9; --card:#fffdf7; --line:#e6e1d3; --line-soft:#efeade;
  --txt:#2b2f36; --sub:#7a7466; --faint:#b5af9f;
  --pri:#2f7e79; --pri-deep:#23615d; --pri-weak:#e9f3f1;      /* 镜青 */
  --gold:#b08d3f; --gold-soft:#f6efdd;                        /* 鎏金 */
  --moon:#6f93c4; --moon-soft:#edf2f8;                        /* 月白 */
  --cinnabar:#b3423a;                                         /* 朱砂 */
  --ink:#1f3352;                                              /* 藏青 */
  --mask:rgba(31,42,56,.72);
  --rv-mortal:#a8a29e; --rv-taixi:#7da7d9; --rv-foundation:#57a773;
  --rv-zifu:#c9a227; --rv-zhenren:#8b74c9; --rv-immortal:#38a3c6;
  --shadow-1:0 1px 2px rgba(43,47,54,.05), 0 4px 14px rgba(43,47,54,.06);
  --shadow-2:0 2px 6px rgba(43,47,54,.08), 0 14px 40px rgba(31,51,82,.16);
  --serif:'Noto Serif SC','Source Han Serif SC','STZhongsong','STSong','SimSun',serif;
  --sans:-apple-system,'Segoe UI','Microsoft YaHei',sans-serif;
  --fs-hero:22px; --fs-title:16px; --fs-body:13px; --fs-cap:12px;
}
* { box-sizing:border-box; margin:0; padding:0; }
html,body { height:100%; }
body { font:14px/1.65 var(--sans); background:var(--bg); color:var(--txt); display:flex; flex-direction:column; overflow:hidden; }
/* 宣纸底纹 + 山水淡彩 */
body::before { content:''; position:fixed; inset:0; pointer-events:none; z-index:0;
  background:
    radial-gradient(1200px 500px at 85% -10%, rgba(111,147,196,.07), transparent 60%),
    radial-gradient(900px 480px at -10% 20%, rgba(47,126,121,.08), transparent 60%),
    radial-gradient(700px 600px at 50% 120%, rgba(176,141,63,.05), transparent 55%);
}
body::after { content:''; position:fixed; inset:0; pointer-events:none; z-index:0; opacity:.5;
  background:repeating-linear-gradient(0deg, transparent 0 3px, rgba(120,110,88,.012) 3px 4px);
}
#app { position:relative; z-index:1; display:flex; flex-direction:column; height:100%; }

/* ===== Header ===== */
header { display:flex; align-items:center; gap:12px; padding:9px 16px; background:rgba(255,253,247,.9); backdrop-filter:blur(6px); border-bottom:1px solid var(--line); flex-shrink:0; position:relative; z-index:30; }
header::after { content:''; position:absolute; left:0; right:0; bottom:-1px; height:2px;
  background:linear-gradient(90deg, var(--pri), var(--gold) 45%, transparent 80%); opacity:.55; }
.mirror-sigil { width:30px; height:30px; border-radius:50%; border:1.5px solid var(--gold); outline:1px solid rgba(176,141,63,.3); outline-offset:2px;
  display:flex; align-items:center; justify-content:center; font:600 14px/1 var(--serif); color:var(--pri-deep);
  background:radial-gradient(circle at 35% 30%, #fdfcf7, #eef4f2); box-shadow:inset 0 0 6px rgba(47,126,121,.18); flex-shrink:0; }
#bookBtn { font:700 16px/1 var(--serif); cursor:pointer; color:var(--ink); letter-spacing:1px; white-space:nowrap; }
#bookBtn:hover { color:var(--pri-deep); }
#bookBtn .caret { color:var(--faint); font-size:11px; margin-left:2px; }
nav.tabs { display:flex; gap:4px; margin-left:8px; }
nav.tabs .tab { padding:7px 13px; font:15px/1 var(--serif); letter-spacing:2px; color:var(--sub); cursor:pointer; border-bottom:2px solid transparent; user-select:none; white-space:nowrap; transition:color .15s; }
nav.tabs .tab:hover { color:var(--ink); }
nav.tabs .tab.on { color:var(--ink); font-weight:700; border-image:linear-gradient(90deg,var(--pri),var(--gold)) 1; border-bottom:2px solid var(--pri); }
#searchBox { flex:1; max-width:300px; margin-left:10px; padding:6px 12px; border:1px solid var(--line); border-radius:8px; font-size:var(--fs-body); outline:none; background:var(--card); color:var(--txt); transition:.15s; }
#searchBox:focus { border-color:var(--pri); box-shadow:0 0 0 3px rgba(47,126,121,.1); }
#gearBtn { border:1px solid var(--line); background:var(--card); border-radius:8px; padding:5px 10px; cursor:pointer; font-size:var(--fs-body); color:var(--sub); position:relative; }
#gearBtn:hover { border-color:var(--pri); color:var(--pri-deep); }
.badge-note { position:absolute; top:-4px; right:-4px; background:var(--cinnabar); border-radius:50%; width:8px; height:8px; display:none; box-shadow:0 0 0 2px var(--card); }

#gearPop { position:absolute; top:46px; right:16px; background:var(--card); border:1px solid var(--line); border-radius:12px; box-shadow:var(--shadow-2); padding:14px 16px; width:262px; z-index:50; display:none; }
#gearPop.open { display:block; animation:pop .16s ease-out; }
@keyframes pop { from { opacity:0; transform:translateY(-4px);} to { opacity:1; transform:none;} }
#gearPop h4 { font:700 14px/1 var(--serif); margin-bottom:10px; color:var(--ink); letter-spacing:2px; }
#gearPop .row { display:flex; align-items:center; gap:8px; font-size:var(--fs-cap); color:var(--sub); margin-bottom:9px; }
#gearPop input[type=number] { width:78px; padding:3px 8px; border:1px solid var(--line); border-radius:6px; background:var(--bg); font-family:inherit; }
.switch { position:relative; width:38px; height:20px; background:#d8d2c2; border-radius:10px; cursor:pointer; transition:.2s; flex-shrink:0; }
.switch.on { background:var(--pri); }
.switch::after { content:''; position:absolute; top:2px; left:2px; width:16px; height:16px; background:#fff; border-radius:50%; transition:.2s; box-shadow:0 1px 2px rgba(0,0,0,.2); }
.switch.on::after { left:20px; }

/* ===== 主区 ===== */
#main { flex:1; overflow-y:auto; padding:14px 16px 48px; }
#main::-webkit-scrollbar { width:9px; }
#main::-webkit-scrollbar-thumb { background:#d5cfc0; border-radius:5px; border:2px solid var(--bg); }
.view { display:none; } .view.on { display:block; animation:fade .25s ease-out; }
@keyframes fade { from { opacity:0; transform:translateY(4px);} to { opacity:1; transform:none;} }
.loading { display:flex; align-items:center; justify-content:center; gap:10px; padding:40px; color:var(--sub); }
.spin { width:18px; height:18px; border:2px solid var(--line); border-top-color:var(--pri); border-radius:50%; animation:sp .8s linear infinite; }
@keyframes sp { to { transform:rotate(360deg); } }
.demo-tag { display:inline-block; font-size:11px; color:#8a6d2f; background:var(--gold-soft); border:1px solid #e7d9b0; border-radius:4px; padding:0 6px; vertical-align:middle; font-weight:400; }

/* ===== 徽章（描边式，弱填充） ===== */
.bdg { display:inline-flex; align-items:center; gap:3px; font-size:var(--fs-cap); padding:1px 8px; border-radius:5px; font-weight:500; white-space:nowrap; border:1px solid; background:rgba(255,255,255,.6); }
.bdg.gen { color:var(--ink); border-color:rgba(31,51,82,.22); background:rgba(31,51,82,.04); }
.bdg.fac { color:#2e6b46; border-color:rgba(46,107,70,.22); background:rgba(46,107,70,.05); }
.bdg.rv { color:#8a6d2f; border-color:rgba(176,141,63,.3); background:var(--gold-soft); }
.bdg.role-core { color:#6d4fc0; border-color:rgba(109,79,192,.28); background:rgba(109,79,192,.06); }
.bdg.role-support { color:#2e6bb0; border-color:rgba(46,107,176,.25); background:rgba(46,107,176,.05); }
.bdg.role-episodic { color:#2e7d4f; border-color:rgba(46,125,79,.25); background:rgba(46,125,79,.05); }
.bdg.role-mention { color:#948d7c; border-color:var(--line); background:rgba(148,141,124,.06); }
.bdg.status { color:var(--sub); border-color:var(--line); }
.rvdot { width:9px; height:9px; border-radius:50%; display:inline-block; flex-shrink:0; box-shadow:inset 0 0 0 2px rgba(255,255,255,.7), 0 0 0 1px rgba(43,47,54,.06); }
.rv-mortal{background:var(--rv-mortal)} .rv-taixi{background:var(--rv-taixi)} .rv-foundation{background:var(--rv-foundation)} .rv-zifu{background:var(--rv-zifu)} .rv-zhenren{background:var(--rv-zhenren)} .rv-immortal{background:var(--rv-immortal)} .rv-none{background:#d8d2c2}
.elem-glyph { font-size:11px; opacity:.85; }

/* ===== 防剧透 ===== */
body.hide-spoiler .sp { filter:blur(5px); user-select:none; background:var(--mask); color:transparent; border-radius:4px; cursor:pointer; }
body.hide-spoiler .sp.reveal { filter:none; user-select:auto; background:transparent; color:inherit; }
body:not(.hide-spoiler) .sp { cursor:default; }
.sp-hint { font-size:11px; color:var(--faint); margin-left:6px; }

/* ===== 筛选 chips ===== */
.filters { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:12px; }
.chip { border:1px solid var(--line); background:var(--card); border-radius:999px; padding:2.5px 11px; font-size:var(--fs-cap); color:var(--sub); cursor:pointer; user-select:none; transition:.15s; }
.chip:hover { border-color:var(--pri); color:var(--pri-deep); }
.chip.on { background:var(--pri-weak); border-color:var(--pri); color:var(--pri-deep); font-weight:600; box-shadow:inset 0 0 0 1px rgba(47,126,121,.15); }

/* ===== 人物列表 ===== */
.list { display:flex; flex-direction:column; gap:7px; }
.item { background:var(--card); border:1px solid var(--line-soft); border-radius:11px; padding:9px 15px; cursor:pointer; display:flex; align-items:center; gap:10px; position:relative; overflow:hidden; transition:border-color .15s, box-shadow .15s, transform .15s; }
.item::before { content:''; position:absolute; left:0; top:18%; bottom:18%; width:3px; border-radius:2px; background:var(--acc,transparent); opacity:0; transition:.15s; }
.item:hover { border-color:rgba(47,126,121,.4); box-shadow:var(--shadow-1); transform:translateY(-1px); }
.item:hover::before { opacity:.85; }
.item .nm { font:700 15px/1.3 var(--serif); white-space:nowrap; color:var(--ink); letter-spacing:.5px; }
.item .al { color:var(--faint); font-size:var(--fs-cap); }
.item .ol { color:var(--sub); font-size:var(--fs-body); flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.item .num { color:var(--faint); font-size:var(--fs-cap); white-space:nowrap; font-variant-numeric:tabular-nums; }
.pager { display:flex; align-items:center; justify-content:center; gap:12px; padding:14px 0 34px; color:var(--sub); font-size:var(--fs-body); }
.pager button { border:1px solid var(--line); background:var(--card); border-radius:7px; padding:4px 14px; cursor:pointer; color:var(--sub); transition:.15s; }
.pager button:hover:not(:disabled) { border-color:var(--pri); color:var(--pri-deep); }
.pager button:disabled { opacity:.35; cursor:default; }

/* ===== 详情卡（覆盖层） ===== */
#detailWrap { position:fixed; inset:0; background:rgba(26,31,42,.42); backdrop-filter:blur(3px); display:none; z-index:40; }
#detailWrap.on { display:flex; align-items:flex-start; justify-content:center; padding:22px 16px; overflow-y:auto; animation:fade .2s; }
.detail { background:var(--card); border-radius:16px; max-width:860px; width:100%; padding:20px 24px 16px; box-shadow:var(--shadow-2); position:relative; border:1px solid var(--line-soft); }
/* 每人不同的顶部气韵发丝线：--elem-c(元素) → --fac-c(势力) → 金 */
.detail::before { content:''; position:absolute; top:0; left:0; right:0; height:3px; border-radius:16px 16px 0 0;
  background:linear-gradient(90deg, var(--elem-c,#2f7e79) 0%, var(--fac-c,#b08d3f) 55%, transparent 92%); opacity:.8; }
.dclose { position:absolute; top:12px; right:16px; color:var(--faint); cursor:pointer; font-size:15px; width:26px; height:26px; display:flex; align-items:center; justify-content:center; border-radius:50%; transition:.15s; }
.dclose:hover { color:var(--cinnabar); background:rgba(179,66,58,.08); }
.detail-top { display:flex; gap:20px; align-items:flex-start; }

/* 立绘：古画装裱角 + 元素色 */
.portrait-frame { position:relative; flex-shrink:0; }
.portrait-frame::before, .portrait-frame::after,
.portrait-frame .pc1, .portrait-frame .pc2 { content:''; position:absolute; width:14px; height:14px; border-color:var(--fac-c,var(--gold)); border-style:solid; opacity:.75; }
.portrait-frame::before { top:-4px; left:-4px; border-width:2px 0 0 2px; }
.portrait-frame::after { top:-4px; right:-4px; border-width:2px 2px 0 0; }
.portrait-frame .pc1 { bottom:-4px; left:-4px; border-width:0 0 2px 2px; }
.portrait-frame .pc2 { bottom:-4px; right:-4px; border-width:0 2px 2px 0; }
.portrait { width:132px; height:176px; border-radius:4px; object-fit:cover; border:1px solid var(--line); background:var(--bg); cursor:zoom-in; display:block; }
.portrait-empty { width:132px; height:176px; border-radius:4px; border:1px dashed var(--line); background:repeating-linear-gradient(45deg, rgba(120,110,88,.03) 0 8px, transparent 8px 16px), var(--bg); display:flex; align-items:center; justify-content:center; color:var(--faint); font-size:12px; writing-mode:vertical-rl; letter-spacing:5px; }
.portrait-cap { text-align:center; font-size:11px; color:var(--faint); margin-top:8px; letter-spacing:1px; }

h1.dname { font:700 var(--fs-hero)/1.4 var(--serif); display:flex; align-items:center; gap:10px; flex-wrap:wrap; color:var(--ink); letter-spacing:1px; }
h1 .al { font:400 13px/1 var(--serif); color:var(--sub); letter-spacing:.5px; }
.chain { display:flex; gap:6px; flex-wrap:wrap; margin-top:8px; }

/* 速答区：镜面渐变 + 元素色左边 */
.quick { position:relative; background:linear-gradient(135deg, rgba(233,243,241,.9), rgba(253,251,245,.9) 70%); border-left:3px solid var(--elem-c,var(--pri)); padding:10px 16px 9px; margin-top:12px; border-radius:0 10px 10px 0; border-top:1px solid var(--line-soft); border-right:1px solid var(--line-soft); border-bottom:1px solid var(--line-soft); }
.quick::after { content:attr(data-glyph); position:absolute; right:12px; top:6px; font:600 26px/1 var(--serif); color:var(--elem-c,var(--pri)); opacity:.12; }
.quick .q1 { font:600 15px/1.6 var(--serif); color:var(--ink); }
.quick .q2 { font-size:var(--fs-body); color:var(--sub); margin-top:2px; }
.quick .q2 b { color:var(--pri-deep); font-weight:600; }
.quick .q3 { font-size:var(--fs-cap); color:var(--faint); margin-top:5px; display:flex; gap:16px; font-variant-numeric:tabular-nums; }
.kv { display:flex; flex-wrap:wrap; gap:6px 18px; margin:10px 0 2px; font-size:var(--fs-body); }
.kv b { color:var(--faint); font-weight:500; margin-right:4px; }

/* 收纳区块 */
.sect { border-top:1px solid var(--line-soft); margin-top:13px; }
.sect > .hd { display:flex; align-items:center; gap:7px; padding:10px 2px; cursor:pointer; user-select:none; font:700 14px/1 var(--serif); color:var(--ink); letter-spacing:2px; }
.sect > .hd:hover { color:var(--pri-deep); }
.sect > .hd .arr { transition:transform .15s; color:var(--faint); font-size:11px; }
.sect.open > .hd .arr { transform:rotate(90deg); }
.sect > .bd { display:none; padding:2px 2px 13px; }
.sect.open > .bd { display:block; }
.sect .cnt { color:var(--faint); font-weight:400; font-size:var(--fs-cap); letter-spacing:0; }

/* ===== 阶段时间带 ===== */
.band { position:relative; margin:8px 0 4px; padding:14px 4px 0; }
.band-track { display:flex; align-items:flex-start; position:relative; }
.band-track::before { content:''; position:absolute; top:16px; left:14px; right:14px; height:2px;
  background:linear-gradient(90deg, #d8d2c2, var(--gold) 85%); opacity:.6; border-radius:2px; }
.stg { min-width:0; text-align:center; position:relative; cursor:pointer; }
.stg .dot { width:13px; height:13px; border-radius:50%; background:var(--card); border:3px solid var(--stg-c,var(--pri)); margin:8px auto 7px; position:relative; z-index:2; transition:.15s; box-shadow:0 1px 3px rgba(43,47,54,.15); }
.stg:hover .dot, .stg.on .dot { transform:scale(1.2); box-shadow:0 0 0 5px rgba(47,126,121,.12), 0 1px 3px rgba(43,47,54,.15); }
.stg .st { font-size:var(--fs-cap); font-weight:600; color:var(--ink); line-height:1.35; font-family:var(--serif); }
.stg .sc { font-size:11px; color:var(--faint); font-variant-numeric:tabular-nums; }
.stg.sp .dot { border-color:var(--cinnabar); }
.stg.sp .st { color:var(--cinnabar); }
.cursor-line { position:absolute; top:2px; bottom:-4px; width:0; border-left:2px dashed var(--gold); z-index:3; opacity:.85; }
.cursor-line::after { content:'读到这'; position:absolute; top:-14px; left:-16px; font-size:10px; color:var(--gold); white-space:nowrap; letter-spacing:1px; }
.stg-detail { background:linear-gradient(135deg, rgba(249,247,240,.9), rgba(253,251,245,.9)); border:1px solid var(--line-soft); border-radius:10px; padding:12px 16px; margin-top:16px; position:relative; }
.stg-detail::before { content:''; position:absolute; left:0; top:12px; bottom:12px; width:3px; border-radius:2px; background:var(--stg-c,var(--elem-c,var(--pri))); }
.stg-detail .tt { font:700 14px/1 var(--serif); color:var(--ink); display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
.stg-detail .desc { font-size:var(--fs-body); color:var(--txt); margin-top:6px; line-height:1.75; }
.stg-detail .meta { font-size:var(--fs-cap); color:var(--sub); margin-top:8px; display:flex; gap:12px; flex-wrap:wrap; align-items:center; }
.btn-gen { border:1px solid var(--gold); color:#8a6d2f; background:var(--gold-soft); border-radius:7px; padding:3px 12px; font-size:var(--fs-cap); cursor:pointer; transition:.15s; }
.btn-gen:hover { background:#f1e5c4; box-shadow:0 1px 4px rgba(176,141,63,.25); }

/* ===== 关系网 ===== */
.relwrap { display:flex; gap:16px; align-items:flex-start; }
.relgraph { width:340px; height:252px; background:radial-gradient(circle at 50% 42%, rgba(233,243,241,.5), rgba(253,251,245,.9)); border:1px solid var(--line-soft); border-radius:12px; position:relative; flex-shrink:0; }
.relgraph svg { width:100%; height:100%; }
.relgraph svg line { stroke:#cfd8d6; stroke-width:1.3; }
.relnode { position:absolute; transform:translate(-50%,-50%); font-size:var(--fs-cap); background:var(--card); border:1px solid rgba(47,126,121,.45); color:var(--pri-deep); border-radius:999px; padding:1px 10px; cursor:pointer; z-index:2; transition:.15s; font-family:var(--serif); }
.relnode:hover { background:var(--pri-weak); box-shadow:0 1px 5px rgba(47,126,121,.2); }
.relnode.me { background:var(--ink); border-color:var(--ink); color:#fdfcf7; font-weight:700; }
.rel-list { flex:1; display:flex; flex-direction:column; gap:6px; }
.relrow { font-size:var(--fs-body); display:flex; align-items:baseline; }
.relrow a { color:var(--pri-deep); cursor:pointer; font:600 13.5px/1 var(--serif); text-decoration:none; }
.relrow a:hover { text-decoration:underline; }
.relrow .rt { color:var(--sub); font-size:var(--fs-cap); }
.reltype { font-size:10px; padding:0 6px; border-radius:3px; margin-right:8px; border:1px solid; background:rgba(255,255,255,.55); flex-shrink:0; }
.rt-kinship{color:#a5423b;border-color:rgba(165,66,59,.3)} .rt-master{color:#2e6bb0;border-color:rgba(46,107,176,.3)} .rt-marriage{color:#bb4f7e;border-color:rgba(187,79,126,.3)} .rt-foe{color:#5c6470;border-color:#c8ccd2} .rt-ally{color:#2e7d4f;border-color:rgba(46,125,79,.3)} .rt-other{color:#948d7c;border-color:var(--line)}

/* 剧情线 */
.tl { display:flex; flex-direction:column; gap:9px; }
.tl .ev { display:flex; gap:12px; }
.tl .ch { flex-shrink:0; width:88px; color:var(--gold); font-size:var(--fs-cap); font-weight:600; text-align:right; font-variant-numeric:tabular-nums; }
.tl .tx { flex:1; border-left:2px solid var(--line); padding-left:12px; font-size:var(--fs-body); position:relative; }
.tl .tx::before { content:''; position:absolute; left:-4.5px; top:8px; width:7px; height:7px; border-radius:50%; background:var(--gold-soft); border:1.5px solid var(--gold); }
blockquote { border-left:3px solid rgba(176,141,63,.4); background:rgba(249,247,240,.7); padding:7px 12px; margin:7px 0; color:#4a463c; border-radius:0 8px 8px 0; font-size:var(--fs-body); font-family:var(--serif); line-height:1.8; }

/* ===== 世家纵表 ===== */
.family-head { display:flex; align-items:baseline; gap:14px; margin:4px 0 14px; }
.family-head h2 { font:700 19px/1 var(--serif); color:var(--ink); letter-spacing:3px; }
.family-head .cnt { color:var(--faint); font-size:var(--fs-cap); }
.gen-row { display:flex; align-items:stretch; gap:14px; background:var(--card); border:1px solid var(--line-soft); border-radius:12px; padding:9px 16px 9px 10px; margin-bottom:8px; position:relative; overflow:hidden; transition:.15s; }
.gen-row:hover { border-color:rgba(31,51,82,.25); box-shadow:var(--shadow-1); }
.gen-row.main-line { border-left:4px solid var(--ink); }

.fac-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:13px; }
.fac-card { background:var(--card); border:1px solid var(--line-soft); border-radius:13px; padding:15px 17px 13px; cursor:pointer; transition:.18s; position:relative; overflow:hidden; }
.fac-card::before { content:''; position:absolute; top:0; left:0; right:0; height:3px; background:var(--fc,#9aa0a6); opacity:.7; }
.fac-card:hover { transform:translateY(-2px); box-shadow:var(--shadow-1); border-color:rgba(43,47,54,.15); }
.fac-card h3 { font:700 var(--fs-title)/1.4 var(--serif); color:var(--ink); display:flex; gap:8px; align-items:center; letter-spacing:1px; }
.stance { font:500 var(--fs-cap)/1.4 var(--sans); padding:1px 8px; border-radius:5px; border:1px solid; }
.st-protagonist{color:#6d4fc0;border-color:rgba(109,79,192,.3);background:rgba(109,79,192,.06)} .st-ally{color:#2e7d4f;border-color:rgba(46,125,79,.3);background:rgba(46,125,79,.06)} .st-foe{color:#a5423b;border-color:rgba(165,66,59,.3);background:rgba(165,66,59,.05)} .st-neutral{color:#6f7466;border-color:var(--line);background:rgba(148,141,124,.06)}

.fac-stg { margin:2px 0 10px; }
.fac-stg .fs-row { display:flex; gap:8px; font-size:var(--fs-cap); color:var(--sub); margin-bottom:4px; align-items:baseline; }
.fac-stg .fs-ch { color:var(--gold); font-variant-numeric:tabular-nums; flex-shrink:0; }
.fac-stg .fs-t { font-weight:600; color:var(--ink); font-family:var(--serif); }

/* ===== 体系页 ===== */
.sys-wrap { display:flex; gap:18px; align-items:flex-start; }
.ladder { flex:0 0 320px; display:flex; flex-direction:column-reverse; gap:7px; }
.rung { display:flex; align-items:center; gap:11px; background:var(--card); border:1px solid var(--line-soft); border-radius:10px; padding:9px 15px; position:relative; overflow:hidden; }
.rung .bar { width:5px; align-self:stretch; border-radius:3px; opacity:.85; }
.rung .rn { font:700 14px/1 var(--serif); color:var(--ink); width:76px; letter-spacing:1px; }
.rung .rc { color:var(--faint); font-size:var(--fs-cap); flex:1; font-variant-numeric:tabular-nums; }
.rung .reps { display:flex; gap:5px; flex-wrap:wrap; }
.rep-chip { font-size:11px; border:1px solid var(--line); border-radius:999px; padding:0 9px; color:var(--pri-deep); cursor:pointer; background:var(--card); font-family:var(--serif); transition:.12s; }
.rep-chip:hover { border-color:var(--pri); background:var(--pri-weak); }
.xj-grid { flex:1; }

.xj-item { background:var(--card); border:1px solid var(--line-soft); border-radius:10px; padding:9px 14px; margin-bottom:7px; display:flex; align-items:center; gap:11px; }
.xj-item .xn { font:700 14px/1 var(--serif); color:var(--ink); letter-spacing:1px; }
.xj-item .xd { color:var(--sub); font-size:var(--fs-cap); flex:1; }
.xj-item .bdg.fac { flex-shrink:0; }

/* toast / lightbox */
#toast { position:fixed; bottom:26px; left:50%; transform:translateX(-50%) translateY(6px); background:rgba(31,42,56,.92); color:#f5f3ec; border-radius:9px; padding:9px 20px; font-size:var(--fs-body); opacity:0; transition:.25s; z-index:99; pointer-events:none; letter-spacing:.5px; }
#toast.on { opacity:1; transform:translateX(-50%); }
#lightbox { position:fixed; inset:0; background:rgba(20,24,32,.85); display:none; align-items:center; justify-content:center; z-index:80; cursor:zoom-out; }
#lightbox.on { display:flex; }
#lightbox img { max-width:90vw; max-height:88vh; border-radius:8px; box-shadow:0 20px 80px rgba(0,0,0,.5); }

/* 响应式两档 */
@media (max-width:699px) {

  nav.tabs .tab { padding:7px 9px; letter-spacing:1px; }
  #searchBox { max-width:none; }
}

<script>
/* ============ 数据加载与模拟层 ============ */

const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));

/* —— 内容驱动的主题层 ——

const FAC_HUE = { '李家':'#2f7e79','明阳道统':'#c08a2d','太阴一府':'#6f93c4','青池宗':'#4a8ba6','金羽宗':'#bd8f2c','萧家':'#6b8f5e','杨家':'#b3423a','越国朝廷':'#8a6d4b','北寰宗':'#5b6b8c','郁家':'#946b4a','袁家':'#7d6b9a','孔家':'#4d7ea8','崔家':'#5f8a6b','修越宗':'#6e8f5a','费家':'#a1746b' };
function elemAccent(c) {
  const t = `${c.cultivation||''} ${c.identity||''} ${(c.persona&&c.persona.appearance)||''} ${(c.aliases||[]).join('')}`;
  if (/器灵|铜镜|玄鉴|镜/.test(t)) return { c:'#2f7e79', g:'鉴' };
  if (/雷/.test(t)) return { c:'#8b74c9', g:'雷' };
  if (/剑/.test(t)) return { c:'#57977b', g:'剑' };
  if (/明阳|金瞳|金眸|金光|金血|火|日/.test(t)) return { c:'#c08a2d', g:'阳' };
  if (/太阴|月|冰|水/.test(t)) return { c:'#6f93c4', g:'月' };
  if (/巫|箓|卜/.test(t)) return { c:'#8a6d4b', g:'巫' };
  if (/丹|药/.test(t)) return { c:'#a1746b', g:'丹' };
  if (/妖|龙|蛇/.test(t)) return { c:'#4d7ea8', g:'妖' };
  return { c:'#8c8f96', g:'' };
}
function facHue(c) { for (const k in FAC_HUE) if ((c.faction||'').includes(k.replace('道统','').replace('朝廷',''))) return FAC_HUE[k]; return '#b08d3f'; }

/* —— 模拟数据（演示占位，带"示例"标签）—— */
const MOCK_STAGES = {

function roleOf(c) {
  if (c.tier === 1) return ['core','核心'];
  if ((c.mentions||0) >= 800) return ['core','核心'];
  if ((c.mentions||0) >= 100) return ['support','重要'];
  if ((c.mentions||0) >= 20) return ['episodic','出场过'];
  return ['mention','仅提及'];
}
function realmCls(c) {
  const t = c.cultivation || '';
  if (/仙位|道胎|器灵/.test(t)) return 'rv-immortal';
  if (/大真人|真人|真君/.test(t)) return 'rv-zhenren';
  if (/紫府|金丹/.test(t)) return 'rv-zifu';
  if (/筑基/.test(t)) return 'rv-foundation';
  if (/胎息/.test(t)) return 'rv-taixi';
  if (/练气|凡人/.test(t)) return 'rv-mortal';
  return 'rv-none';
}
const isSp = ch => S.spoiler && ch > S.progress;

function bindUI() {
  document.querySelectorAll('.tab').forEach(t => t.onclick = () => {
    document.querySelectorAll('.tab').forEach(x => x.classList.remove('on'));
    t.classList.add('on'); S.view = t.dataset.v;
    document.querySelectorAll('.view').forEach(v => v.classList.remove('on'));
    $('#v-' + t.dataset.v).classList.add('on');
  });
  $('#searchBox').oninput = e => { S.kw = e.target.value.trim(); S.page = 1; renderList(); };
  $('#gearBtn').onclick = e => { e.stopPropagation(); $('#gearPop').classList.toggle('open'); };
  document.addEventListener('click', e => { if (!e.target.closest('#gearPop') && !e.target.closest('#gearBtn')) $('#gearPop').classList.remove('open'); });
  $('#spSwitch').onclick = () => {
    S.spoiler = !S.spoiler;
    $('#spSwitch').classList.toggle('on', S.spoiler);
    document.body.classList.toggle('hide-spoiler', S.spoiler);
    $('#gearDot').style.display = S.spoiler ? 'none' : 'block';
    renderDetail();
  };
  $('#progInput').onchange = e => {
    S.progress = Math.max(0, Math.min(1604, parseInt(e.target.value) || 0));
    toast('阅读进度已设为第 ' + S.progress + ' 章');
    renderDetail(); renderFamily();
  };
  document.body.classList.toggle('hide-spoiler', S.spoiler);
  document.addEventListener('click', e => { if (e.target.classList.contains('sp') && S.spoiler) { e.target.classList.toggle('reveal'); e.stopPropagation(); } });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
      if ($('#lightbox').classList.contains('on')) $('#lightbox').classList.remove('on');
      else if ($('#detailWrap').classList.contains('on')) closeDetail();
    }
  });
  $('#lightbox').onclick = () => $('#lightbox').classList.remove('on');
  $('#detailWrap').onclick = e => { if (e.target.id === 'detailWrap') closeDetail(); };
}
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('on'); setTimeout(() => t.classList.remove('on'), 1800); }

/* ============ 人物列表 ============ */
function filtered() {
  let cs = DATA.characters;
  if (S.filter) cs = cs.filter(c => S.filter.t === 'fac' ? c.faction === S.filter.v : c.generation === S.filter.v);
  const k = S.kw.toLowerCase();
  if (k) cs = cs.filter(c => c.name.toLowerCase().includes(k) || (c.aliases||[]).some(a=>a.toLowerCase().includes(k)) || (c.pinyin||'').includes(k));
  return cs;
}
function renderList() {
  const cs = filtered();
  const total = cs.length, pages = Math.max(1, Math.ceil(total / S.PAGE));
  if (S.page > pages) S.page = pages;
  const rows = cs.slice((S.page - 1) * S.PAGE, S.page * S.PAGE);
  const chips = [`<span class="chip ${!S.filter?'on':''}" data-f="">全部 ${DATA.characters.length}</span>`];
  for (const g of (DATA.generations||[]).slice(0,11)) chips.push(`<span class="chip ${S.filter&&S.filter.t==='gen'&&S.filter.v===g?'on':''}" data-f="gen:${esc(g)}">${g.replace('李家','').replace('（','·').replace('）','')}</span>`);
  for (const f of ['李家','青池宗','萧家','明阳道统','杨家']) chips.push(`<span class="chip ${S.filter&&S.filter.t==='fac'&&S.filter.v===f?'on':''}" data-f="fac:${f}">${f}</span>`);
  const listHtml = rows.map(c => {
    const [rk, rl] = roleOf(c);
    return `<div class="item" data-id="${esc(c.id)}" style="--acc:${elemAccent(c).c}">
      <span class="rvdot ${realmCls(c)}" title="${esc(c.cultivation||'境界未知')}"></span>
      <span class="nm">${esc(c.name)}</span>
      ${(c.aliases&&c.aliases[0])?`<span class="al">${esc(c.aliases[0])}</span>`:''}
      <span class="bdg role-${rk}">${rl}</span>
      <span class="ol">${esc(c.oneLiner||'')}</span>
      <span class="num">${c.firstChapter?('首现'+c.firstChapter+'章'):''} · ${fmtNum(c.mentions)}次</span>
    </div>`;
  }).join('');
  $('#v-list').innerHTML = `
    <div class="filters">${chips.join('')}</div>
    <div class="list">${rows.length ? listHtml : '<div class="loading">没有匹配的人物</div>'}</div>
    <div class="pager">
      <button id="pgPrev" ${S.page<=1?'disabled':''}>‹ 上一页</button>
      <span>第 ${S.page} / ${pages} 页 · 共 ${total} 人</span>
      <button id="pgNext" ${S.page>=pages?'disabled':''}>下一页 ›</button>
    </div>`;
  $('#v-list').querySelectorAll('.item').forEach(el => el.onclick = () => openDetail(el.dataset.id));
  $('#v-list').querySelectorAll('.chip[data-f]').forEach(el => el.onclick = () => {
    if (!el.dataset.f) S.filter = null;
    else { const [t, v] = el.dataset.f.split(':'); S.filter = (S.filter && S.filter.v === v) ? null : { t: t === 'gen' ? 'gen' : 'fac', v }; }
    S.page = 1; renderList();
  });
  const prev = $('#pgPrev'), next = $('#pgNext');
  if (prev) prev.onclick = () => { S.page--; renderList(); $('#main').scrollTop = 0; };
  if (next) next.onclick = () => { S.page++; renderList(); $('#main').scrollTop = 0; };
}

/* ============ 详情卡 ============ */
function openDetail(id) {
  const c = DATA.characters.find(x => x.id === id);
  if (!c) return;
  S.cur = c; S.curStg = 0;
  $('#detailWrap').classList.add('on');
  renderDetail();
}
function closeDetail() { $('#detailWrap').classList.remove('on'); }

function renderDetail() {
  const c = S.cur; if (!c || !$('#detailWrap').classList.contains('on')) return;
  const [rk, rl] = roleOf(c);
  const ea = elemAccent(c), fc = facHue(c);
  const stages = MOCK_STAGES[c.id] || [];
  const hasImg = IMAGES.has(c.id);
  const vis = MOCK_VISUAL[c.id];
  const card = $('#detailCard');
  card.style.setProperty('--elem-c', ea.c);
  card.style.setProperty('--fac-c', fc);
  const img = hasImg
    ? `<img class="portrait" src="data/images/${c.id}.png" onclick="document.getElementById('lightbox').classList.add('on');document.querySelector('#lightbox img').src=this.src">`
    : `<div class="portrait-empty">${vis ? '立绘待基调拍板' : '无外貌依据 · 不生成'}</div>`;
  const stgHtml = stages.length ? bandHtml(c, stages) : `<div style="color:var(--sub);font-size:var(--fs-cap)">暂无阶段数据（t1 精修批次 W1 产出后填充；t2 将按笔记提炼 1-3 段）</div>`;

  const rels = (c.relationships || []).slice(0, 12).map(r => {
    const [ty, tl] = REL_TYPE(r.relation || '');
    return `<div class="relrow"><span class="reltype rt-${ty}">${tl}</span><a data-id="${esc(r.id||'')}">${esc(r.name)}</a> <span class="rt">${esc(r.relation||'')}</span></div>`;
  }).join('') || '<div style="color:var(--sub);font-size:var(--fs-cap)">暂无关系数据（t2 关系抽取批次产出后填充）</div>';

  const tlHtml = (c.timeline || []).map(t => `<div class="ev"><span class="ch">第${t.chapter}章</span><div class="tx ${isSp(t.chapter)?'sp':''}">${esc(t.event)}</div></div>`).join('');
  const evHtml = (c.evidence || []).map(e => `<blockquote>${esc(e)}</blockquote>`).join('');

  const persona = c.persona || {};
  const personaHtml = [
    persona.appearance && `<p><b>外貌</b>　${esc(persona.appearance)}</p>`,
    (persona.personality&&persona.personality.length) && `<p><b>性格</b>　${esc(persona.personality.join(' · '))}</p>`,
    persona.motivation && `<p><b>动机</b>　${esc(persona.motivation)}</p>`,
    persona.arc && `<p><b>轨迹</b>　${esc(persona.arc)}</p>`,
  ].filter(Boolean).join('') || '<span style="color:var(--sub)">暂无</span>';

  const statusHtml = c.status ? `<span class="bdg status sp">${esc(c.status)}</span><span class="sp-hint">点击确认</span>` : '';

  card.innerHTML = `
    <span class="dclose" onclick="document.getElementById('detailWrap').classList.remove('on')">✕</span>
    <div class="detail-top">
      <div class="portrait-frame"><span class="pc1"></span><span class="pc2"></span>${img}<div class="portrait-cap">${ea.g?('气韵 · '+ea.g):(fc?'':'')}</div></div>
      <div style="flex:1;min-width:0">
        <h1 class="dname">${esc(c.name)}
          ${(c.aliases||[]).length?`<span class="al">${esc(c.aliases.slice(0,4).join(' · '))}</span>`:''}
          <span class="bdg role-${rk}">${rl}</span>${statusHtml}
        </h1>
        <div class="chain">
          ${c.generation?`<span class="bdg gen">${esc(c.generation)}</span>`:''}
          ${c.faction?`<span class="bdg fac">${esc(c.faction)}</span>`:''}
          ${c.cultivation?`<span class="bdg rv">${esc(c.cultivation.slice(0,18))}</span>`:''}
        </div>
        <div class="quick" data-glyph="${ea.g||''}">
          <div class="q1">${esc(c.oneLiner||'（速答句待 W1/W3 批次改写）')}</div>
          <div class="q2"><b>与主线：</b>${esc(c.id==='liximing'?'李家实际顶梁柱，陆江仙最重要的"合作者"，多次借仙鉴布局':'（待补 toProtagonist 字段）')}</div>
          <div class="q3"><span>首现 第${c.firstChapter||'?'}章</span><span class="${isSp(c.lastChapter)?'sp':''}">最近 第${c.lastChapter||'?'}章</span><span>提及 ${fmtNum(c.mentions)}次 / ${c.chapterCount}章</span></div>
        </div>
        <div class="kv">
          ${c.gender?`<span><b>性别</b>${esc(c.gender)}</span>`:''}
          ${c.identity?`<span><b>身份</b>${esc(c.identity)}</span>`:''}
          ${c.faction?`<span><b>势力</b>${esc(c.faction)}</span>`:''}
        </div>
      </div>
    </div>
    <div class="sect open"><div class="hd"><span class="arr">▶</span>发展脉络 <span class="demo-tag">示例数据</span> <span class="cnt">${stages.length||0} 阶段</span></div>
      <div class="bd">${stgHtml}</div></div>
    <div class="sect open"><div class="hd"><span class="arr">▶</span>关系网 <span class="cnt">${(c.relationships||[]).length}</span></div>
      <div class="bd"><div class="relwrap">${relMockGraph(c)}<div class="rel-list">${rels}</div></div></div></div>
    <div class="sect"><div class="hd"><span class="arr">▶</span>人物侧写</div><div class="bd">${personaHtml}</div></div>
    <div class="sect"><div class="hd"><span class="arr">▶</span>剧情线 <span class="cnt">${(c.timeline||[]).length} 条 · 超出进度的已打码</span></div><div class="bd"><div class="tl">${tlHtml||'暂无'}</div></div></div>
    <div class="sect"><div class="hd"><span class="arr">▶</span>原文摘录 <span class="cnt">${(c.evidence||[]).length}</span></div><div class="bd">${evHtml||'暂无'}</div></div>
  `;
  card.querySelectorAll('.stg').forEach(el => el.onclick = () => { S.curStg = +el.dataset.i; renderStgDetail(c, stages); });
  card.querySelectorAll('.relrow a[data-id]').forEach(el => el.onclick = () => { if (el.dataset.id) openDetail(el.dataset.id); });
  card.querySelectorAll('.sect > .hd').forEach(hd => hd.onclick = () => hd.parentElement.classList.toggle('open'));
  card.querySelectorAll('.btn-gen').forEach(b => b.onclick = e => { e.stopPropagation(); copyPrompt(c, stages[S.curStg]); });
  renderStgDetail(c, stages);
}

function bandHtml(c, stages) {
  const cursorPos = S.progress > 0 ? (4 + (S.progress / 1604) * (100 - 8)) : null;
  const nodes = stages.map((st, i) => {
    const sp = S.spoiler && st.s > S.progress;
    return `<div class="stg ${sp?'sp':''} ${i===S.curStg?'on':''}" data-i="${i}" style="flex:${Math.max(1,(st.e-st.s))};--stg-c:${stgColor(st)}">
      <div class="dot"></div><div class="st">${esc(st.title)}</div><div class="sc">${st.s===st.e?('第'+st.s+'章'):('约'+st.s+'-'+st.e)}</div>
    </div>`;
  }).join('');
  return `<div class="band">
    ${cursorPos!==null?`<div class="cursor-line" style="left:${cursorPos}%"></div>`:''}
    <div class="band-track">${nodes}</div>
  </div><div id="stgDetail"></div>`;
}
function stgColor(st) {
  const rv = st.rv || '';
  if (/仙|道/.test(rv)) return 'var(--rv-immortal)';
  if (/大真人/.test(rv)) return 'var(--rv-zhenren)';
  if (/紫府/.test(rv)) return 'var(--rv-zifu)';
  if (/筑基/.test(rv)) return 'var(--rv-foundation)';
  if (/胎息/.test(rv)) return 'var(--rv-taixi)';
  return 'var(--pri)';
}
function renderStgDetail(c, stages) {
  const box = $('#stgDetail'); if (!box || !stages.length) return;
  const st = stages[S.curStg] || stages[0];
  const sp = S.spoiler && st.s > S.progress;
  box.innerHTML = `<div class="stg-detail">
    <div class="tt">${esc(st.title)} <span style="color:var(--faint);font-weight:400;font-size:var(--fs-cap);font-family:var(--sans)">第${st.s}${st.e>st.s?('-'+st.e):''}章</span>
      ${st.rv&&st.rv!=='-'?`<span class="bdg rv">${esc(st.rv)}</span>`:''}
      ${sp?'<span class="bdg" style="color:#a5423b;border-color:rgba(165,66,59,.3)">进度之后</span>':''}
    </div>
    <div class="desc ${sp?'sp':''}">${esc(st.sit)}</div>
    <div class="meta">
      ${st.vis?`<span>形象锚点：${esc(st.vis)}</span>`:''}
      ${(MOCK_VISUAL[c.id]||st.vis)?`<button class="btn-gen">🎨 按此阶段拼装生图提示词</button>`:''}
    </div>
  </div>`;
  box.querySelectorAll('.btn-gen').forEach(b => b.onclick = () => copyPrompt(c, st));
}
function copyPrompt(c, st) {
  const base = MOCK_VISUAL[c.id] || '';
  const p = (st && st.vis) ? `${st.vis}；${base}` : base;
  const text = `【基调串·待拍板】+ ${p} + 全身单人立绘，脚下留一成边距，画面无文字`;
  (navigator.clipboard ? navigator.clipboard.writeText(text) : Promise.reject()).then(
    () => toast('已复制生图提示词（基调串拍板后替换）'),
    () => toast(text.slice(0, 60)));
}
function relMockGraph(c) {
  const rels = (c.relationships || []).slice(0, 8);
  const pos = [[50,12],[16,32],[84,30],[26,58],[74,60],[50,84],[12,84],[88,86]];
  const cx = 50, cy = 46;
  const lines = rels.map((r, i) => `<line x1="${cx}%" y1="${cy}%" x2="${pos[i][0]}%" y2="${pos[i][1]}%"/>`).join('');
  const nodes = rels.map((r, i) => `<div class="relnode" style="left:${pos[i][0]}%;top:${pos[i][1]}%" data-id="${esc(r.id||'')}">${esc(r.name)}</div>`).join('');
  return `<div class="relgraph"><svg preserveAspectRatio="none">${lines}<circle cx="${cx}%" cy="${cy}%" r="4" fill="#1f3352"/></svg>
    <div class="relnode me" style="left:${cx}%;top:${cy}%">${esc(c.name)}</div>${nodes}</div>`;
}

/* ============ 世家纵表 ============ */
function renderFamily() {
  const ZIBEI = ['木','长','项','通','玄','渊','曦','周','绛','遂','阙'];
  const heads = { 1:'李木田',3:'李项平',5:'李玄宣',6:'李渊蛟',7:'李曦城',8:'李周巍' };
  const rows = ZIBEI.map((z, i) => {
    const mem = DATA.characters.filter(c => (c.generation||'').includes(z + '字辈'));
    const shown = mem.slice(0, 14);
    const nodes = shown.map(c => {
      const head = Object.values(heads).includes(c.name);
      return `<span class="gm ${c.tier===3?'faded':''}" data-id="${esc(c.id)}"><span class="rvdot ${realmCls(c)}"></span>${esc(c.name)}${head?'<span class="star">✦</span>':''}</span>`;
    }).join('');
    const more = mem.length > 14 ? `<span class="gm more">+${mem.length - 14} 人</span>` : '';
    return `<div class="gen-row ${heads[i+1]!==undefined?'main-line':''}">
      <div class="gen-label"><div class="g1">${z}</div><div class="g2">李家${i+1}世</div></div>
      <div class="gen-members">${nodes || '<span style="color:var(--faint);font-size:var(--fs-cap)">（本代成员待 W0 字辈推断补全）</span>'}${more}</div>
    </div>`;
  }).join('');
  $('#v-family').innerHTML = `
    <div class="family-head"><h2>李家 · 十一世</h2><span class="cnt">✦ 家主 · 圆点色 = 境界（金 = 紫府及以上）· 左缘竖线 = 家主世系</span></div>
    ${rows}`;
  $('#v-family').querySelectorAll('.gm[data-id]').forEach(el => el.onclick = () => openDetail(el.dataset.id));
}

/* ============ 势力页 ============ */
function renderFaction() {
  const cards = MOCK_FACT.map(f => {
    const stg = (f.stages||[]).map(st => {
      const sp = S.spoiler && st.s > S.progress;
      return `<div class="fs-row"><span class="fs-ch">${st.s}-${st.e}</span><span class="${sp?'sp':''}"><span class="fs-t">${esc(st.title)}</span> · ${esc(st.sit)}</span></div>`;
    }).join('');
    return `<div class="fac-card" style="--fc:${f.hue}" data-id="${esc(f.id)}">
      <h3>${esc(f.name)} <span class="stance st-${f.stance}">${esc(f.stanceTxt)}</span></h3>
      <div class="fo">${esc(f.one)}</div>
      ${stg?`<div class="fac-stg"><div style="margin-bottom:6px"><span class="demo-tag">脉络示例</span></div>${stg}</div>`:''}
      <div class="fm">成员 <b>${f.members}</b> 人${f.core.length?` · 核心：${esc(f.core.join('、'))}`:''}</div>
    </div>`;
  }).join('');
  $('#v-faction').innerHTML = `<div style="margin-bottom:12px;color:var(--sub);font-size:var(--fs-cap)">势力实体为 W2 批次产出（22 个 faction 值归一为 ~17 实体），以下 8 个为演示占位；卡片顶色条 = 势力专属色</div>
    <div class="fac-grid">${cards}</div>`;
}

/* ============ 体系页 ============ */
function renderSystem() {
  const rungs = REALMS.map(r => `<div class="rung">
    <span class="bar ${r.key}"></span><span class="rn">${r.name}</span><span class="rc">已确认 ${r.n} 人</span>
    <span class="reps">${r.reps.map(p=>`<span class="rep-chip">${esc(p)}</span>`).join('')}</span>
  </div>`).join('');
  const xj = XIANJI.map(x => `<div class="xj-item"><span class="xn">${esc(x.n)}${x.mock?'<span class="demo-tag">推断</span>':''}</span><span class="xd">${esc(x.d)}</span><span class="bdg fac">${esc(x.p)}</span></div>`).join('');
  $('#v-system').innerHTML = `
    <div style="margin-bottom:12px;color:var(--sub);font-size:var(--fs-cap)">境界称谓与人数为演示口径（境界枚举表 W0 定稿后以结构化 cultivation 统计）</div>
    <div class="sys-wrap">
      <div class="ladder">${rungs}</div>
      <div class="xj-grid"><h3>仙基图鉴 <span class="demo-tag">示例</span></h3>${xj}
        <div style="margin-top:10px;color:var(--faint);font-size:var(--fs-cap)">道统对照（明阳 / 太阴 / 都仙…）在 W4 批次后补充</div></div>
    </div>`;
}
</script>
</body>
</html>
