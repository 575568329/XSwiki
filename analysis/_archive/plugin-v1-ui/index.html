<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>小说Wiki</title>
<style>
:root {
  --bg: #f6f7f9; --card: #fff; --line: #e5e7eb; --txt: #1f2328; --sub: #6b7280;
  --pri: #4f6ef7; --pri-weak: #eef1fe; --ok: #16a34a; --warn: #d97706; --gray: #9ca3af;
  --tier1: #7c3aed; --tier2: #2563eb; --tier3: #6b7280;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font: 14px/1.6 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; background: var(--bg); color: var(--txt); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

/* 顶栏 */
header { display: flex; align-items: center; gap: 8px; padding: 10px 14px; background: var(--card); border-bottom: 1px solid var(--line); flex-shrink: 0; }
header .book { font-weight: 600; font-size: 15px; }
header .meta { color: var(--sub); font-size: 12px; }
header .spacer { flex: 1; }
.icon-btn { border: 1px solid var(--line); background: var(--card); border-radius: 6px; padding: 4px 10px; cursor: pointer; font-size: 13px; color: var(--txt); }
.icon-btn:hover { border-color: var(--pri); color: var(--pri); }

/* 主区 */
#main { flex: 1; overflow-y: auto; padding: 12px 14px; }
#main::-webkit-scrollbar { width: 8px; }
#main::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 4px; }

/* 过滤条 */
.filters { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
.chip { border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 2px 10px; font-size: 12px; color: var(--sub); cursor: pointer; user-select: none; }
.chip.on { background: var(--pri-weak); border-color: var(--pri); color: var(--pri); font-weight: 600; }

/* 列表 */
.list { display: flex; flex-direction: column; gap: 8px; }
.item { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; cursor: pointer; display: flex; align-items: center; gap: 12px; }
.item:hover, .item.kbd { border-color: var(--pri); box-shadow: 0 1px 6px rgba(79, 110, 247, .15); }
.item .nm { font-size: 16px; font-weight: 700; white-space: nowrap; }
.item .al { color: var(--sub); font-size: 12px; margin-left: 6px; }
.item .ol { color: var(--sub); font-size: 13px; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item .num { color: var(--gray); font-size: 12px; white-space: nowrap; }
.tdot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.t1 { background: var(--tier1); } .t2 { background: var(--tier2); } .t3 { background: var(--tier3); }

/* 详情 */
.detail { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; }
.detail h1 { font-size: 22px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.detail h1 .al { font-size: 14px; color: var(--sub); font-weight: 400; }
.badge { display: inline-block; font-size: 12px; padding: 1px 8px; border-radius: 4px; background: var(--pri-weak); color: var(--pri); font-weight: 500; }
.badge.gray { background: #f3f4f6; color: var(--sub); }
.badge.purple { background: #f3e8ff; color: var(--tier1); }
.oneliner { color: var(--sub); margin: 6px 0 2px; }
.kv { display: flex; flex-wrap: wrap; gap: 6px 18px; margin: 10px 0; font-size: 13px; }
.kv b { color: var(--sub); font-weight: 500; margin-right: 4px; }

/* 收纳区块: 默认收起 */
.sect { border-top: 1px solid var(--line); margin-top: 10px; }
.sect > .hd { display: flex; align-items: center; gap: 6px; padding: 9px 2px; cursor: pointer; user-select: none; font-weight: 600; font-size: 14px; }
.sect > .hd .arr { transition: transform .15s; color: var(--gray); font-size: 12px; }
.sect.open > .hd .arr { transform: rotate(90deg); }
.sect > .bd { display: none; padding: 2px 2px 12px; color: var(--txt); }
.sect.open > .bd { display: block; }
.sect .cnt { color: var(--gray); font-weight: 400; font-size: 12px; margin-left: 2px; }

.rels { display: flex; flex-direction: column; gap: 6px; }
.rel { display: flex; gap: 8px; align-items: baseline; }
.rel a { color: var(--pri); cursor: pointer; text-decoration: none; font-weight: 600; }
.rel a:hover { text-decoration: underline; }
.rel .rr { color: var(--sub); font-size: 13px; }
.tl { display: flex; flex-direction: column; gap: 8px; }
.tl .ev { display: flex; gap: 10px; }
.tl .ch { flex-shrink: 0; width: 86px; color: var(--pri); font-size: 12px; font-weight: 600; text-align: right; }
.tl .tx { flex: 1; border-left: 2px solid var(--line); padding-left: 10px; }
blockquote { border-left: 3px solid var(--pri-weak); background: #fafbff; padding: 6px 10px; margin: 6px 0; color: #374151; border-radius: 0 6px 6px 0; font-size: 13px; }

/* 加载/空态 */
.loading { display: flex; align-items: center; justify-content: center; gap: 10px; padding: 40px; color: var(--sub); }
.spin { width: 18px; height: 18px; border: 2px solid var(--line); border-top-color: var(--pri); border-radius: 50%; animation: sp .8s linear infinite; }
@keyframes sp { to { transform: rotate(360deg); } }
.empty { text-align: center; color: var(--gray); padding: 50px 0; }
.foot-note { text-align: center; color: var(--gray); font-size: 12px; padding: 10px 0 20px; }
.back { color: var(--pri); cursor: pointer; font-size: 13px; margin-bottom: 10px; display: inline-block; }
#bookName { cursor: pointer; }
#bookName:hover { color: var(--pri); }
.booklist { display: flex; flex-direction: column; gap: 10px; }
#toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(20px); background: #1f2328; color: #fff; padding: 8px 16px; border-radius: 8px; font-size: 13px; opacity: 0; pointer-events: none; transition: all .25s; z-index: 99; max-width: 80%; }
#toast.show { opacity: .95; transform: translateX(-50%) translateY(0); }
#btnSync.busy { opacity: .5; pointer-events: none; }
.bookcard { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 18px; cursor: pointer; transition: border-color .15s, box-shadow .15s; }
.bookcard:hover { border-color: var(--pri); box-shadow: 0 2px 10px rgba(79,110,247,.15); }
.bookcard .btitle { font-size: 17px; font-weight: 700; }
.bookcard .bmeta { color: var(--sub); font-size: 13px; margin: 3px 0 6px; }
.bookcard .bsum { color: var(--sub); font-size: 13px; line-height: 1.7; }
.portrait { width: 108px; height: 108px; border-radius: 10px; object-fit: cover; border: 1px solid var(--line); background: #f3f4f6; flex-shrink: 0; }
.seal-avatar { display: flex; align-items: center; justify-content: center; overflow: hidden; }
.seal-avatar svg { width: 100%; height: 100%; border-radius: 10px; }
.mini-seal { width: 30px; height: 30px; flex-shrink: 0; display: inline-flex; }
.mini-seal svg { width: 100%; height: 100%; border-radius: 6px; }
.detail-top { display: flex; gap: 16px; align-items: flex-start; }
</style>
</head>
<body>
<header>
  <span class="book" id="bookName">加载中…</span>
  <span class="meta" id="bookMeta"></span>
  <input id="searchBox" type="text" placeholder="搜索人物 / 别名 / 拼音…" autocomplete="off" spellcheck="false"
    style="flex:1;max-width:340px;margin-left:10px;padding:5px 10px;border:1px solid var(--line);border-radius:6px;font-size:13px;outline:none;background:var(--card);color:var(--txt);">
  <span class="spacer"></span>
  <button class="icon-btn" id="btnSync" title="检查数据更新（新书/新数据从服务器同步）">⟳ 更新</button>
  <button class="icon-btn" id="btnHome" title="返回书目/全部人物">☰ 全部</button>
</header>
<div id="main"><div class="loading"><div class="spin"></div>正在加载数据…</div></div>
<div id="toast"></div>
<script src="app.js"></script>
</body>
</html>
